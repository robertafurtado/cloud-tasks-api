name: CD - deploy EC2
on:
  workflow_run:
    workflows: ["CI - tests and image"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  deploy:
    # Only successful CI runs started by pushes to main.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: [self-hosted, ec2-deploy]
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Deploy immutable image
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${DEPLOY_SHA}"
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bash scripts/deploy.sh "$IMAGE"
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify remote endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: curl --fail --show-error --retry 10 --retry-delay 3 --retry-all-errors "http://${EC2_HOST}/health"
